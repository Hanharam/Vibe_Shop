let failMessage = '';

const findProduct = id => PRODUCTS.find(p => p.id === id);
const won = n => `${n.toLocaleString('ko-KR')}원`;
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);

function isValidItem(item) {
  const p = findProduct(item && item.productId);
  return Boolean(p)
    && p.sizes.includes(item.size)
    && p.colors.some(c => c.name === item.color)
    && Number.isInteger(item.quantity)
    && item.quantity >= 1
    && item.quantity <= MAX_QTY;
}

function loadCart() {
  try {
    const saved = JSON.parse(localStorage.getItem(CART_KEY));
    return Array.isArray(saved) ? saved.filter(isValidItem) : [];
  } catch {
    return [];
  }
}

let cart = loadCart();

function updateBadge() {
  const count = cart.reduce((sum, item) => sum + item.quantity, 0);
  badge.textContent = count > 0 ? count : '';
}

function persist() {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
  updateBadge();
}

function thumb(p) {
  return `<div class="thumb"><img src="${esc(p.imageUrl)}" alt="${esc(p.name)}" loading="lazy"></div>`;
}

function visibleProducts() {
  const list = PRODUCTS.filter(p => currentCategory === '전체' || p.category === currentCategory);
  if (currentSort === 'priceAsc') return list.sort((a, b) => a.price - b.price);
  if (currentSort === 'priceDesc') return list.sort((a, b) => b.price - a.price);
  return list;
}

function renderList() {
  const items = visibleProducts();
  app.innerHTML = `
    <h1 class="sr-only">STYLE SHOP — 오버핏 티셔츠, 데님, 아우터 온라인 쇼핑몰</h1>
    <div class="tabs" role="group" aria-label="카테고리">
      ${CATEGORIES.map(c => `<button class="chip" data-category="${c}" aria-pressed="${c === currentCategory}">${c}</button>`).join('')}
    </div>
    <div class="toolbar">
      <p class="count">${items.length}개 상품</p>
      <select id="sort" aria-label="정렬">
        ${Object.entries(SORTS).map(([k, v]) => `<option value="${k}"${k === currentSort ? ' selected' : ''}>${v}</option>`).join('')}
      </select>
    </div>
    <div class="grid">
      ${items.map(p => `
        <a class="card" href="#/product/${p.id}">
          ${thumb(p)}
          <div class="card-body">
            <h2 class="card-name">${esc(p.name)}</h2>
            <p class="price">${won(p.price)}</p>
          </div>
        </a>`).join('')}
    </div>`;

  app.querySelectorAll('[data-category]').forEach(btn => btn.addEventListener('click', () => {
    currentCategory = btn.dataset.category;
    renderList();
  }));
  app.querySelector('#sort').addEventListener('change', e => {
    currentSort = e.target.value;
    renderList();
  });
}

function pick(buttons, active) {
  buttons.forEach(b => b.setAttribute('aria-pressed', String(b === active)));
}

function setMsg(el, text, type) {
  el.textContent = text;
  el.className = `msg ${type}`;
}

function renderDetail(id) {
  const p = findProduct(id);
  if (!p) {
    app.innerHTML = `<div class="empty"><p>상품을 찾을 수 없습니다.</p><a class="btn-outline" href="#/">목록으로</a></div>`;
    return;
  }

  const sel = { size: null, color: null };
  app.innerHTML = `
    <a class="back-link" href="#/">← 목록으로</a>
    <div class="detail">
      ${thumb(p)}
      <div>
        <p class="detail-cat">${esc(p.category)}</p>
        <h1 class="detail-name">${esc(p.name)}</h1>
        <p class="detail-price">${won(p.price)}</p>
        <p class="detail-desc">${esc(p.description)}</p>
        <p class="opt-title">사이즈</p>
        <div class="opt-list">
          ${p.sizes.map(s => `<button class="size-btn" data-size="${esc(s)}" aria-pressed="false">${esc(s)}</button>`).join('')}
        </div>
        <p class="opt-title">색상</p>
        <div class="opt-list">
          ${p.colors.map(c => `<button class="swatch-btn" data-color="${esc(c.name)}" aria-pressed="false"><span class="swatch" style="background:${c.hex}"></span>${esc(c.name)}</button>`).join('')}
        </div>
        <button class="add-btn" id="add">장바구니 담기</button>
        <p class="msg" id="msg" role="status"></p>
      </div>
    </div>`;

  const msg = app.querySelector('#msg');
  const sizeButtons = [...app.querySelectorAll('[data-size]')];
  const colorButtons = [...app.querySelectorAll('[data-color]')];

  sizeButtons.forEach(b => b.addEventListener('click', () => {
    sel.size = b.dataset.size;
    pick(sizeButtons, b);
  }));
  colorButtons.forEach(b => b.addEventListener('click', () => {
    sel.color = b.dataset.color;
    pick(colorButtons, b);
  }));

  app.querySelector('#add').addEventListener('click', () => {
    const need = !sel.size && !sel.color ? '사이즈와 색상을' : !sel.size ? '사이즈를' : !sel.color ? '색상을' : null;
    if (need) {
      setMsg(msg, `${need} 선택해 주세요.`, 'error');
      return;
    }
    const same = cart.find(i => i.productId === p.id && i.size === sel.size && i.color === sel.color);
    if (same && same.quantity >= MAX_QTY) {
      setMsg(msg, `최대 ${MAX_QTY}개까지 담을 수 있습니다.`, 'error');
      return;
    }
    if (same) same.quantity += 1;
    else cart.push({ productId: p.id, size: sel.size, color: sel.color, quantity: 1 });
    persist();
    setMsg(msg, '장바구니에 담았습니다.', 'ok');
  });
}

function renderCart() {
  if (cart.length === 0) {
    app.innerHTML = `
      <h1 class="cart-title">장바구니</h1>
      <div class="empty"><p>장바구니가 비어 있습니다.</p><a class="btn-outline" href="#/">쇼핑 계속하기</a></div>`;
    return;
  }

  const total = cart.reduce((sum, item) => sum + findProduct(item.productId).price * item.quantity, 0);
  app.innerHTML = `
    <h1 class="cart-title">장바구니</h1>
    <table class="cart-table">
      <thead>
        <tr><th>상품</th><th class="num">단가</th><th>수량</th><th class="num">소계</th><th></th></tr>
      </thead>
      <tbody>
        ${cart.map((item, i) => {
          const p = findProduct(item.productId);
          return `
          <tr>
            <td>
              <a class="cart-item-name" href="#/product/${p.id}">${esc(p.name)}</a>
              <div class="cart-meta">${esc(item.size)} / ${esc(item.color)}</div>
            </td>
            <td class="num">${won(p.price)}</td>
            <td>
              <div class="qty">
                <button data-action="dec" data-index="${i}" aria-label="수량 줄이기"${item.quantity <= 1 ? ' disabled' : ''}>−</button>
                <span>${item.quantity}</span>
                <button data-action="inc" data-index="${i}" aria-label="수량 늘리기"${item.quantity >= MAX_QTY ? ' disabled' : ''}>+</button>
              </div>
            </td>
            <td class="num">${won(p.price * item.quantity)}</td>
            <td><button class="del-btn" data-action="remove" data-index="${i}">삭제</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="cart-summary">
      <p class="total">합계 <strong>${won(total)}</strong></p>
      <button class="order-btn" id="order">주문하기</button>
    </div>`;

  app.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => {
    const i = Number(btn.dataset.index);
    const item = cart[i];
    if (btn.dataset.action === 'inc') item.quantity = Math.min(item.quantity + 1, MAX_QTY);
    if (btn.dataset.action === 'dec') item.quantity = Math.max(item.quantity - 1, 1);
    if (btn.dataset.action === 'remove') cart.splice(i, 1);
    persist();
    renderCart();
  }));

  app.querySelector('#order').addEventListener('click', startPayment);
}

let widgets = null;
let paymentWindow = null;

function orderName() {
  const first = cart[0] ? findProduct(cart[0].productId).name : '주문';
  return cart.length > 1 ? `${first} 외 ${cart.length - 1}건` : first;
}

async function startPayment() {
  const amount = cart.reduce((sum, item) => sum + findProduct(item.productId).price * item.quantity, 0);
  const orderId = `order-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
  localStorage.setItem(PENDING_KEY, JSON.stringify({ orderId, amount }));
  try {
    widgets = TossPayments(TOSS_CLIENT_KEY).widgets({ customerKey: TossPayments.ANONYMOUS });
    await widgets.setAmount({ value: amount, currency: 'KRW' });
    if (paymentWindow) await paymentWindow.destroy();
    paymentWindow = await widgets.renderPaymentWindow({
      orderName: orderName(),
      variantKey: { paymentMethod: 'DEFAULT', agreement: 'AGREEMENT' },
    });
  } catch (error) {
    failMessage = error.message || '결제창을 열 수 없습니다.';
    location.hash = '#/payment-fail';
    return;
  }

  paymentWindow.on('paymentRequest', async () => {
    try {
      await widgets.requestPayment({
        orderId,
        orderName: orderName(),
        successUrl: RETURN_URL,
        failUrl: RETURN_URL,
      });
    } catch (error) {
      failMessage = error.message || '결제를 진행할 수 없습니다.';
      location.hash = '#/payment-fail';
    }
  });
}

function renderFaq() {
  app.innerHTML = `
    <a class="back-link" href="#/">← 목록으로</a>
    <h1 class="faq-title">자주 묻는 질문</h1>
    <div class="faq-list">
      ${FAQS.map((item, i) => `
        <div class="faq-item">
          <button class="faq-q" id="faq-q-${i}" aria-expanded="false" aria-controls="faq-a-${i}">
            <span>${esc(item.q)}</span>
            <span class="faq-q-mark" aria-hidden="true">+</span>
          </button>
          <p class="faq-a" id="faq-a-${i}" role="region" aria-labelledby="faq-q-${i}" hidden>${esc(item.a)}</p>
        </div>`).join('')}
    </div>`;

  app.querySelectorAll('.faq-q').forEach(btn => btn.addEventListener('click', () => {
    const answer = document.getElementById(btn.getAttribute('aria-controls'));
    const open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!open));
    answer.hidden = open;
  }));
}

function renderComplete() {
  app.innerHTML = `
    <div class="complete">
      <h1>주문이 완료되었습니다</h1>
      <p>감사합니다. 주문 내역은 저장되지 않습니다.</p>
      <a class="btn-outline" href="#/">쇼핑 계속하기</a>
    </div>`;
}

function renderFail() {
  app.innerHTML = `
    <div class="complete">
      <h1>결제에 실패했습니다</h1>
      <p>${esc(failMessage || '결제가 완료되지 않았습니다. 장바구니는 그대로 남아 있습니다.')}</p>
      <a class="btn-outline" href="#/cart">장바구니로 돌아가기</a>
    </div>`;
  failMessage = '';
}

function confirmPayment(params) {
  const pending = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null');
  if (!pending || pending.orderId !== params.get('orderId') || Number(params.get('amount')) !== pending.amount) {
    failMessage = '결제 정보가 일치하지 않아 주문을 완료할 수 없습니다.';
    location.hash = '#/payment-fail';
    return;
  }
  cart = [];
  persist();
  localStorage.removeItem(PENDING_KEY);
  location.hash = '#/order-complete';
}

function parseRoute() {
  const path = location.hash.replace(/^#/, '') || '/';
  const match = path.match(/^\/product\/([^/]+)$/);
  if (match) return { name: 'detail', id: match[1] };
  if (path === '/cart') return { name: 'cart' };
  if (path === '/faq') return { name: 'faq' };
  if (path === '/order-complete') return { name: 'complete' };
  if (path === '/payment-fail') return { name: 'fail' };
  return { name: 'list' };
}

function updateMeta(title, description) {
  document.title = title;
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc && description) metaDesc.setAttribute('content', description);
}

function render() {
  const route = parseRoute();
  if (route.name === 'detail') {
    renderDetail(route.id);
    const p = findProduct(route.id);
    if (p) updateMeta(`${p.name} | STYLE SHOP`, p.description);
  } else if (route.name === 'cart') {
    renderCart();
    updateMeta('장바구니 | STYLE SHOP', '장바구니에 담은 상품을 확인하고 주문할 수 있습니다.');
  } else if (route.name === 'faq') {
    renderFaq();
    updateMeta('자주 묻는 질문 | STYLE SHOP', '배송, 교환/환불, 결제 수단 등 자주 묻는 질문을 확인하세요.');
  } else if (route.name === 'complete') {
    renderComplete();
    updateMeta('주문 완료 | STYLE SHOP', '주문이 완료되었습니다.');
  } else if (route.name === 'fail') {
    renderFail();
    updateMeta('결제 실패 | STYLE SHOP', '결제가 완료되지 않았습니다.');
  } else {
    renderList();
    updateMeta('STYLE SHOP | 오버핏 티셔츠, 데님, 아우터 온라인 쇼핑몰', '오버핏 티셔츠, 린넨 셔츠, 와이드 데님 팬츠, 윈드브레이커, 비니, 토트백 등 데일리 캐주얼 의류와 액세서리를 만나보세요.');
  }
}

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});

updateBadge();
history.replaceState(null, '', location.pathname + location.hash);
if (RETURN_PARAMS.has('paymentKey')) confirmPayment(RETURN_PARAMS);
else if (RETURN_PARAMS.has('code')) {
  failMessage = RETURN_PARAMS.get('message') || '';
  location.hash = '#/payment-fail';
} else render();
</script>
</body>
</html>
